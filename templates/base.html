{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}｜本棚アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static 'book/css/style.css' %}">
  
  </head>
  <body>

    <nav class="navbar navbar-dark bg-dark sticky-top">
      <div class="d-flex flex-row">
        <a class="nav-link text-white me-3" href="{% url 'list-book' %}">書籍一覧</a>
        <a class="nav-link text-white me-3" href="{% url 'create-book' %}">書籍登録</a>
        {% if request.user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="nav-link text-white bg-transparent border-0">ログアウト</button>
        </form>
        {% else %}
        <a class="nav-link text-white me-3" href="{% url 'login' %}">ログイン</a>
        <a class="nav-link text-white" href="{% url 'signup' %}">ユーザ登録</a>
            {% endif %}
      </div>
    </nav>
    <div class="p-4">
      <h1>{% block h1 %}{% endblock h1 %}</h1>
      {% block content %}{% endblock content %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
